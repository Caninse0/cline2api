name: Upstream CLI Release

# 独立于 build.yml（桌面端）的流水线：只负责 CLI 产物。
# 每 2 天检查一次上游是否发布新 tag：
#   无新版本 → 直接结束；有新版本 → 拉取该 tag 的源码包，交叉编译 linux amd64/arm64，
#   产物覆盖式上传到本仓库固定的 latest release（tag 恒为 latest，滚动更新）。
on:
  schedule:
    # UTC 03:00，日期为奇数时触发（约每 2 天一次）
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 跳过版本比对，强制重新构建并覆盖发布
        type: boolean
        default: false

permissions:
  contents: write

# latest release 是滚动覆盖的，必须避免并发构建互相覆盖
concurrency:
  group: upstream-cli-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: luawei1/cline2api
  # 固定的发布目标 tag：所有版本的 CLI 产物都滚动覆盖到这里
  RELEASE_TAG: latest

jobs:
  # ---------------------------------------------------------------------------
  # 1. 探测上游最新版本号，并与 latest release 已发布的版本比对
  # ---------------------------------------------------------------------------
  check:
    name: Check upstream version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.detect.outputs.version }}
      needed: ${{ steps.detect.outputs.needed }}
    steps:
      - name: Detect upstream latest tag
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 用 ls-remote 取 tag，不占用 API 配额；sort -V 做语义化版本排序
          VERSION=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" \
            | awk '{print $2}' | sed 's|refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+' | sort -V | tail -n1)

          if [ -z "$VERSION" ]; then
            echo "::error::未能从上游 ${UPSTREAM_REPO} 获取到任何版本 tag"
            exit 1
          fi

          echo "上游最新版本号：${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "手动触发且 force=true，跳过版本比对"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # latest release 的 notes 里带着当前已发布的版本号，用它判断是否已是最新
          BODY=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body' 2>/dev/null || true)
          ASSETS=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)

          # sed 的 q 命令在首个匹配后立即退出，避免 head 提前关闭管道触发 SIGPIPE
          PUBLISHED=$(printf '%s\n' "$BODY" | sed -n '/^版本：/{s/^版本：//;p;q;}')
          echo "latest release 当前版本：${PUBLISHED:-（无）}"
          echo "latest release 当前产物：$(printf '%s' "$ASSETS" | tr '\n' ' ')"

          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$VERSION" ] \
            && printf '%s\n' "$ASSETS" | grep -qx 'cline-proxy-amd64' \
            && printf '%s\n' "$ASSETS" | grep -qx 'cline-proxy-arm64'; then
            echo "latest release 已是上游最新版本 ${VERSION}，无新版本发布，流水线结束"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "发现上游新版本 ${VERSION}（或产物缺失），进入构建流程"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 2. 拉源码 → 交叉编译 → 覆盖式发布到 latest release
  # ---------------------------------------------------------------------------
  publish:
    name: Build & publish CLI
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Fetch upstream source
        id: fetch
        run: |
          set -euo pipefail

          URL="https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${VERSION}.zip"
          echo "下载源码包：${URL}"

          mkdir -p "$RUNNER_TEMP/upstream"
          cd "$RUNNER_TEMP/upstream"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o source.zip "$URL"
          unzip -q -o source.zip

          # 解压后目录名由上游决定（tag v1.6.1 → cline2api-1.6.1），动态探测避免写死
          # -print -quit 直接取第一个结果，不用 head（避免 SIGPIPE）
          SRC=$(find . -maxdepth 1 -mindepth 1 -type d -print -quit)
          SRC="${SRC#./}"
          echo "源码目录：$SRC"
          echo "src=$RUNNER_TEMP/upstream/$SRC" >> "$GITHUB_OUTPUT"
          echo "gomod=$RUNNER_TEMP/upstream/$SRC/go.mod" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ steps.fetch.outputs.gomod }}
          cache: true
          cache-dependency-path: ${{ steps.fetch.outputs.src }}/go.sum

      - name: Build linux binaries
        working-directory: ${{ steps.fetch.outputs.src }}
        env:
          GOOS: linux
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"
          for arch in amd64 arm64; do
            echo "::group::build linux/${arch}"
            GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.appVersion=${VERSION}" \
              -o "$GITHUB_WORKSPACE/dist/cline-proxy-${arch}" .
            echo "::endgroup::"
          done

          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          cd dist

          file cline-proxy-amd64 cline-proxy-arm64

          # 断言产物架构正确，避免 GOARCH 静默失效
          file cline-proxy-amd64 | grep -q 'x86-64' \
            || { echo "::error::cline-proxy-amd64 不是 x86-64 产物"; exit 1; }
          file cline-proxy-arm64 | grep -q 'aarch64' \
            || { echo "::error::cline-proxy-arm64 不是 aarch64 产物"; exit 1; }

          # 冒烟测试：本机可执行 amd64 产物
          chmod +x cline-proxy-amd64
          ./cline-proxy-amd64 -h 2>&1 | grep -q 'Usage' \
            || echo "::warning::cline-proxy-amd64 冒烟测试未通过，请人工确认"

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          构建产物类型：命令行/cli
          目标架构：linux amd64、linux aarch64/arm64
          版本：${VERSION}
          EOF

          # 所有版本都滚动发布到固定的 ${RELEASE_TAG} tag；首次运行创建，之后只更新
          # 用 GITHUB_TOKEN 创建 tag/release 不会触发其他 workflow，无需担心 build.yml 被连带唤醒
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "更新已有 release：${RELEASE_TAG}"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          else
            echo "创建 release：${RELEASE_TAG}"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi

          # --clobber 实现覆盖式上传
          gh release upload "$RELEASE_TAG" \
            dist/cline-proxy-amd64 dist/cline-proxy-arm64 \
            --repo "$GITHUB_REPOSITORY" --clobber

          echo "发布完成：${RELEASE_TAG} <- ${VERSION}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'
